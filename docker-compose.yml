# Local development environment: Postgres + the API + the worker.
# Docker Compose automatically reads variables from the .env file in this folder.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"            # laptop port 5434 (5432 is taken by a native Windows Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A separate, throwaway database only for tests.
  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: stocksense_test
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: test-password
    ports:
      - "5433:5432"            # different port on your laptop, so it never clashes with db
    tmpfs:
      - /var/lib/postgresql/data   # stored in memory: fast, and wiped on restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    env_file: .env
    environment:
      DB_HOST: db              # inside Docker, the database's hostname is the service name
      DB_PORT: "5432"
    ports:
      - "8000:8080"            # laptop port 8000 -> container port 8080
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres is actually ready
    # Development only: mount the code and auto-reload on changes.
    volumes:
      - ./services/api/app:/app/app
      - ./services/api/alembic:/app/alembic
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  # The worker. Locally there is no Pub/Sub, so you play Pub/Sub yourself:
  # POST a sample envelope to http://localhost:8001/pubsub/invoice-uploaded
  worker:
    build:
      context: ./services/worker
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      INVOICES_BUCKET: local-invoices   # matches the API's fake signer bucket
    ports:
      - "8001:8080"            # laptop port 8001 (the API uses 8000)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/worker/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

volumes:
  pgdata: