name: Deploy

on:
  push:
    branches: [main]      # every merged PR...
    paths-ignore:         # ...except ones that only touch these files
      - "**.md"
      - "ops/**"
  workflow_dispatch:       # manual re-deploy button

permissions:
  contents: read

jobs:
  # 1) Same lint + alembic check + tests as on PRs (defined once in ci.yml)
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  # 2) Build both images once, push, migrate, deploy both services to DEV (automatic)
  deploy-dev:
    name: deploy-dev
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One dev deploy at a time; never cancel one halfway through
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    environment:
      name: dev
      url: ${{ steps.url.outputs.url }}

    permissions:
      contents: read
      id-token: write

    # Hand the exact image names to the prod job
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      worker_image: ${{ steps.images.outputs.worker_image }}

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      API_SERVICE: ${{ vars.API_SERVICE }}
      WORKER_SERVICE: ${{ vars.WORKER_SERVICE }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      API_IMAGE: ${{ vars.AR_REPO }}/api:${{ github.sha }}
      WORKER_IMAGE: ${{ vars.AR_REPO }}/worker:${{ github.sha }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (WIF, no keys)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build images (tag = commit SHA)
        run: |
          docker build -t "${API_IMAGE}" services/api
          docker build -t "${WORKER_IMAGE}" services/worker

      - name: Push images
        run: |
          docker push "${API_IMAGE}"
          docker push "${WORKER_IMAGE}"

      - name: Record images for promotion
        id: images
        run: |
          echo "api_image=${API_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "worker_image=${WORKER_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Point the migration job at the new API image
        run: gcloud run jobs update "${MIGRATE_JOB}" --image="${API_IMAGE}" --region="${REGION}" --project="${PROJECT_ID}" --quiet

      - name: Run database migrations (fails if Cloud SQL is stopped)
        run: gcloud run jobs execute "${MIGRATE_JOB}" --region="${REGION}" --project="${PROJECT_ID}" --wait

      - name: Deploy new API revision
        run: gcloud run deploy "${API_SERVICE}" --image="${API_IMAGE}" --region="${REGION}" --project="${PROJECT_ID}" --quiet

      - name: Get service URL
        id: url
        run: echo "url=$(gcloud run services describe "${API_SERVICE}" --region="${REGION}" --project="${PROJECT_ID}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Smoke test /health/ready
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 5 "${{ steps.url.outputs.url }}/health/ready"

      # The worker is internal-only, so a runner on the internet can't call it.
      # "gcloud run deploy" waits until the new revision is Ready and fails if
      # it can't start (e.g. a missing setting), so that is our check.
      - name: Deploy new worker revision
        run: gcloud run deploy "${WORKER_SERVICE}" --image="${WORKER_IMAGE}" --region="${REGION}" --project="${PROJECT_ID}" --quiet

  # 3) Promote the SAME images to PROD (waits for your approval)
  deploy-prod:
    name: deploy-prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    # Required reviewer -> job pauses here until you click Approve.
    # This also makes the OIDC subject "repo:Xioketh/stocksense:environment:prod",
    # the ONLY identity prod WIF trusts.
    environment:
      name: prod
      url: ${{ steps.url.outputs.url }}

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      API_SERVICE: ${{ vars.API_SERVICE }}
      WORKER_SERVICE: ${{ vars.WORKER_SERVICE }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      API_IMAGE: ${{ needs.deploy-dev.outputs.api_image }}
      WORKER_IMAGE: ${{ needs.deploy-dev.outputs.worker_image }}

    steps:
      - name: Authenticate to Google Cloud (prod WIF, no keys)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Show what is being promoted
        run: |
          echo "Promoting to ${PROJECT_ID} (already deployed in dev):"
          echo "  api:    ${API_IMAGE}"
          echo "  worker: ${WORKER_IMAGE}"

      - name: Point the migration job at the API image
        run: gcloud run jobs update "${MIGRATE_JOB}" --image="${API_IMAGE}" --region="${REGION}" --project="${PROJECT_ID}" --quiet

      - name: Run database migrations (fails if prod Cloud SQL is stopped)
        run: gcloud run jobs execute "${MIGRATE_JOB}" --region="${REGION}" --project="${PROJECT_ID}" --wait

      - name: Deploy new API revision
        run: gcloud run deploy "${API_SERVICE}" --image="${API_IMAGE}" --region="${REGION}" --project="${PROJECT_ID}" --quiet

      - name: Get service URL
        id: url
        run: echo "url=$(gcloud run services describe "${API_SERVICE}" --region="${REGION}" --project="${PROJECT_ID}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Smoke test /health/ready
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 5 "${{ steps.url.outputs.url }}/health/ready"

      - name: Deploy new worker revision
        run: gcloud run deploy "${WORKER_SERVICE}" --image="${WORKER_IMAGE}" --region="${REGION}" --project="${PROJECT_ID}" --quiet