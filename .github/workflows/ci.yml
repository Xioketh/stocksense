name: CI

on:
  # Runs on every PR that targets main
  pull_request:
    branches: [main]
  # Lets the deploy workflow reuse these exact jobs, so tests are defined once
  workflow_call:

# PR code is untested code: read-only repo access, and NO id-token,
# so this workflow can never get Google Cloud credentials.
permissions:
  contents: read

# The job names "lint" and "test" are REQUIRED status checks in the
# "protect-main" ruleset. Keep these names, or PRs can never be merged.
# Each job checks ALL services, one after the other.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff (same pinned version as requirements-dev.txt)
        run: pip install "$(grep '^ruff==' services/api/requirements-dev.txt)"

      - name: Ruff (api)
        working-directory: services/api
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Ruff (worker)
        working-directory: services/worker
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Ruff (assistant)
        working-directory: services/assistant
        run: |
          ruff check --output-format=github .
          ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Throwaway Postgres, same settings as db-test in docker-compose.yml.
    # The worker's tests create their own database (stocksense_worker_test) on it.
    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_DB: stocksense_test
          POSTGRES_USER: stocksense
          POSTGRES_PASSWORD: test-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stocksense -d stocksense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5433"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.12 (with pip cache)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/requirements-dev.txt
            services/worker/requirements.txt
            services/worker/requirements-dev.txt
            services/assistant/requirements.txt
            services/assistant/requirements-dev.txt

      # ---------- api ----------
      - name: Install dependencies (api)
        working-directory: services/api
        run: pip install -r requirements-dev.txt

      - name: Migrations match the models (alembic upgrade + check)
        working-directory: services/api
        env:
          DB_HOST: localhost
          DB_PORT: "5433"
          DB_NAME: stocksense_test
          DB_USER: stocksense
          DB_PASSWORD: test-password
          API_KEY: ci-not-a-real-key
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests (api)
        working-directory: services/api
        run: pytest

      # ---------- worker ----------
      - name: Install dependencies (worker)
        working-directory: services/worker
        run: pip install -r requirements-dev.txt

      - name: Run tests (worker)
        working-directory: services/worker
        run: pytest

      # ---------- assistant ----------
      # No database yet; every key in its conftest is fake, so CI needs no secrets.
      - name: Install dependencies (assistant)
        working-directory: services/assistant
        run: pip install -r requirements-dev.txt

      - name: Run tests (assistant)
        working-directory: services/assistant
        run: pytest